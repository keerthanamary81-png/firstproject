<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Welcome</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f172a,#1e293b,#312e81);

            /* ✅ FIX */
            overflow-y:auto;
            padding:30px 10px;
            position:relative;
        }

        body::before{
            content:'';
            position:absolute;
            width:300px;
            height:300px;
            background:#00f5ff;
            border-radius:50%;
            filter:blur(150px);
            top:-100px;
            left:-100px;
            z-index:0;
        }

        body::after{
            content:'';
            position:absolute;
            width:300px;
            height:300px;
            background:#7c3aed;
            border-radius:50%;
            filter:blur(150px);
            bottom:-100px;
            right:-100px;
            z-index:0;
        }

        .login-card{
            width:420px;
            max-width:90%;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,0.15);
            border-radius:25px;
            padding:40px;
            box-shadow:0 20px 50px rgba(0,0,0,0.4);
            z-index:10;

            /* ✅ FIX */
            max-height:90vh;
            overflow-y:auto;
        }

        .logo{
            text-align:center;
            margin-bottom:15px;
        }

        .logo i{
            font-size:60px;
            color:#00f5ff;
        }

        h2{
            color:white;
            text-align:center;
            margin-bottom:30px;
            font-weight:600;
        }

        label{
            display:block;
            color:#dbeafe;
            margin-top:15px;
            margin-bottom:8px;
            font-size:14px;
        }

        input{
            width:100%;
            height:55px;
            border:none;
            border-radius:12px;
            background:rgba(255,255,255,0.08);
            color:white;
            padding:0 15px;
            font-size:15px;
        }

        input::placeholder{
            color:#94a3b8;
        }

        input:focus{
            outline:none;
            border:1px solid #00f5ff;
        }

        .login-btn{
            width:100%;
            height:55px;
            border:none;
            border-radius:12px;
            margin-top:25px;
            background:linear-gradient(90deg,#06b6d4,#3b82f6);
            color:white;
            font-size:17px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
        }

        .login-btn:hover{
            transform:translateY(-2px);
            box-shadow:0 10px 25px rgba(59,130,246,0.4);
        }

        .error{
            color:#ff6b6b;
            text-align:center;
            margin-top:15px;
            font-size:14px;
        }

        .social{
            display:flex;
            gap:12px;
            margin-top:25px;
        }

        .social div{
            flex:1;
            text-align:center;
            padding:12px;
            border-radius:10px;
            background:rgba(255,255,255,0.08);
            color:white;
            cursor:pointer;
        }

        .register-btn{
            display:block;
            text-align:center;
            margin-top:20px;
            padding:14px;
            text-decoration:none;
            color:#00f5ff;
            border:2px solid #00f5ff;
            border-radius:12px;
            font-weight:600;
        }

        .register-btn:hover{
            background:#00f5ff;
            color:#0f172a;
        }

        .footer-text{
            text-align:center;
            color:#cbd5e1;
            margin-top:15px;
            font-size:13px;
        }

        @media(max-width:500px){
            .login-card{
                padding:30px 20px;
            }

            .social{
                flex-direction:column;
            }
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">
        <i class="fas fa-user-circle"></i>
    </div>

    <h2>Welcome Back</h2>

    <form method="POST">
        {% csrf_token %}
        <h1>{{tes}}</h1>

        <label>Username</label>
        <input type="text" name="username" placeholder="Enter your username" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required>

        <button type="submit" class="login-btn">Log In</button>

        {% if error_message %}
        <p class="error">{{ error_message }}</p>
        {% endif %}

        <div class="social">
            <div><i class="fab fa-google"></i> Google</div>
            <div><i class="fab fa-facebook-f"></i> Facebook</div>
        </div>

        <a href="{% url 'register_func' %}" class="register-btn">
            CREATE ACCOUNT
        </a>

        <p class="footer-text">Secure Login Portal</p>
    </form>

</div>

</body>
</html>
