<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Login</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle at top,#1e3a8a,#0f172a,#020617);
    overflow-y:auto;
    padding:20px;
}

/* glowing shapes */
.shape{
    position:absolute;
    width:250px;
    height:250px;
    border-radius:50%;
    filter:blur(120px);
    opacity:0.7;
    z-index:0;
}

.shape.one{
    background:#00f5ff;
    top:10%;
    left:10%;
}

.shape.two{
    background:#a855f7;
    bottom:10%;
    right:10%;
}

/* form box */
form{
    width:380px;
    max-width:95%;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:20px;
    padding:40px;
    box-shadow:0 25px 60px rgba(0,0,0,0.5);
    z-index:10;
    position:relative;
}

/* title */
form h2{
    text-align:center;
    color:#fff;
    margin-bottom:20px;
    font-size:26px;
}

/* labels */
label{
    display:block;
    color:#cbd5e1;
    margin-top:15px;
    font-size:14px;
}

/* inputs */
input{
    width:100%;
    height:50px;
    margin-top:8px;
    border:none;
    border-radius:12px;
    padding:0 15px;
    font-size:15px;
    background:rgba(255,255,255,0.08);
    color:white;
}

input::placeholder{
    color:#94a3b8;
}

input:focus{
    outline:none;
    border:1px solid #00f5ff;
}

/* button */
button{
    width:100%;
    margin-top:25px;
    height:52px;
    border:none;
    border-radius:12px;
    background:linear-gradient(90deg,#06b6d4,#8b5cf6);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(139,92,246,0.4);
}

/* social */
.social{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.social div{
    flex:1;
    text-align:center;
    padding:10px;
    border-radius:10px;
    background:rgba(255,255,255,0.08);
    color:white;
    cursor:pointer;
    transition:0.3s;
    font-size:13px;
}

.social div:hover{
    background:rgba(255,255,255,0.18);
}

/* responsive */
@media(max-width:500px){
    form{
        padding:30px 20px;
    }

    .social{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="shape one"></div>
<div class="shape two"></div>

<form method="POST">
    {% csrf_token %}

    <h2>Create Account 🚀</h2>

    <label>Username</label>
    <input type="text" name="username" placeholder="Enter username" required>

    <label>Password</label>
    <input type="password" name="password" placeholder="Enter password" required>

    <button type="submit">REGISTER</button>

    <div class="social">
        <div><i class="fab fa-google"></i> Google</div>
        <div><i class="fab fa-facebook-f"></i> Facebook</div>
    </div>

</form>

</body>
</html>
